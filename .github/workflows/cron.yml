name: TaskStack Daily Reminders

on:
  schedule:
    - cron: '59 19 * * *' # Runs every day at 19:59 UTC
  workflow_dispatch: # Allows you to run it manually from the GitHub UI for testing

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Send Cron Request
        run: |
          curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" \
               "https://taskstack.wuaze.com/cron/send_reminders.php?key=TaskStackSecureCronKey2026"
